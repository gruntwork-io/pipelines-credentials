name: Pipelines Credentials
description: Fetch Pipelines Credentials (v2 - parallel multi-token)
inputs:
  token_requests:
    description: 'JSON array of token requests: [{"name": "...", "path": "...", "fallback_env": "..."}]'
    required: true
  api_base_url:
    default: "https://api.prod.app.gruntwork.io/api/v1"
outputs:
  tokens_json:
    description: 'JSON object with all fetched tokens keyed by name'
    value: ${{ steps.get_token.outputs.tokens_json }}

runs:
  using: composite
  steps:
    - name: Fetch Pipelines Tokens
      id: get_token
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
      env:
        TOKEN_REQUESTS: ${{ inputs.token_requests }}
        API_BASE_URL: ${{ inputs.api_base_url }}
      with:
        script: |
          const sleep = (ms) => new Promise(r => setTimeout(r, ms))

          const isRetryableError = (error) => {
            const msg = String(error)
            // Network / transient errors
            if (/TypeError|ECONN|EPIPE|ETIMEDOUT|ENOTFOUND|EAI_AGAIN|ECONNABORTED|socket disconnected|Request timeout|AbortError|TimeoutError|TLS/.test(msg)) return true
            // HTTP 5xx or 429 (rate limit)
            const statusMatch = msg.match(/HTTP (\d{3})/) || msg.match(/: (\d{3})$/)
            if (statusMatch) {
              const status = parseInt(statusMatch[1])
              return status >= 500 || status === 429
            }
            return false
          }

          const formatError = (error) => {
            let msg = `${error.name}: ${error.message}`
            if (error.cause) {
              msg += `\n  Cause: ${error.cause}`
              if (error.cause.code) msg += ` (code: ${error.cause.code})`
              if (error.cause.syscall) msg += ` (syscall: ${error.cause.syscall})`
              if (error.cause.hostname) msg += ` (host: ${error.cause.hostname})`
            }
            if (error.code) msg += `\n  Code: ${error.code}`
            return msg
          }

          const withRetry = async (fn, stepName, retries = 5) => {
            for (let i = 1; i <= retries; i++) {
              try {
                return await fn()
              } catch (error) {
                const isRetryable = isRetryableError(error)
                console.log(`[${stepName}] Attempt ${i}/${retries} failed (retryable: ${isRetryable})`)
                console.log(`  ${formatError(error)}`)
                if (i < retries && isRetryable) {
                  // Exponential backoff: 2^i seconds (2s, 4s, 8s, 16s) + jitter
                  const backoff = Math.pow(2, i) * 1000 + Math.random() * 1000
                  console.log(`  Retrying in ${Math.round(backoff / 1000)}s...`)
                  await sleep(backoff)
                } else {
                  throw error
                }
              }
            }
          }

          const handleLimitExceeded = async (body) => {
            const limit = body?.detail?.limits?.[0]?.limit
            const used = body?.detail?.limits?.[0]?.used
            const excess = used - limit
            const devPortalUrl = 'https://app.gruntwork.io'
            const salesEmail = 'sales@gruntwork.io'
            const message = `You're now using **${used} of ${limit}** infrastructure units included in your plan—exceeding the limit by **${excess} units**. Effective immediately, **your pipelines have been paused** for all of your repositories.\n\nTo continue using Pipelines, [contact sales](mailto:${salesEmail}) to upgrade your plan or request a one-time restoration of service during which you may reduce your usage. You can view your current usage in the [Gruntwork Developer Portal](${devPortalUrl}).`

            await core.summary
              .addHeading('Your Pipelines have been paused')
              .addEOL()
              .addRaw(message)
              .write({ overwrite: true })

            if (context.payload.pull_request) {
              try {
                const marker = '<!-- pipelines-limit-exceeded -->'
                const commentBody = `${marker}\n## Your Gruntwork Pipelines have been paused\n\n${message}`
                const { owner, repo } = context.repo
                const issue_number = context.payload.pull_request.number
                const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number })
                const existing = comments.find(c => c.body.startsWith(marker))
                if (existing) {
                  const { data } = await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: commentBody })
                  console.log(`Updated comment: ${data.html_url}`)
                } else {
                  const { data } = await github.rest.issues.createComment({ owner, repo, issue_number, body: commentBody })
                  console.log(`Created comment: ${data.html_url}`)
                }
              } catch (e) {
                console.log(`Failed to post PR comment: ${e.message}`)
              }
            }
          }

          const tokenRequests = JSON.parse(process.env.TOKEN_REQUESTS)
          const apiBaseURL = process.env.API_BASE_URL
          let providerToken = null

          // Step 1 & 2: Get OIDC token and login (once for all tokens)
          try {
            const idToken = await withRetry(
              () => core.getIDToken("https://api.prod.app.gruntwork.io"),
              "getIDToken"
            )

            providerToken = await withRetry(async () => {
              const res = await fetch(`${apiBaseURL}/tokens/auth/login`, {
                method: "POST",
                headers: { "Authorization": `Bearer ${idToken}` }
              })
              if (!res.ok) {
                if (res.status === 403) {
                  try {
                    const body = await res.json()
                    if (body.error === "LIMIT_EXCEEDED") {
                      await handleLimitExceeded(body)
                    }
                  } catch (_) {}
                }
                throw new Error(`HTTP ${res.status}: ${res.statusText}`)
              }
              return (await res.json()).token
            }, "login")
          } catch (error) {
            console.log(`Auth failed, using fallbacks for all tokens:`)
            console.log(`  ${formatError(error)}`)
          }

          // Step 3: Fetch all PATs in parallel (or use fallbacks if auth failed)
          const tokensOutput = {}

          if (providerToken) {
            // Parallel fetch all tokens
            const fetchPromises = tokenRequests.map(async (req) => {
              try {
                const token = await withRetry(async () => {
                  const res = await fetch(`${apiBaseURL}/tokens/pat/${req.path}`, {
                    headers: { "Authorization": `Bearer ${providerToken}` }
                  })
                  if (!res.ok) throw new Error(`HTTP ${res.status}: ${res.statusText}`)
                  return (await res.json()).token
                }, `fetchToken:${req.name}`)
                return { name: req.name, fallback_env: req.fallback_env, success: true, token }
              } catch (error) {
                console.log(`[${req.name}] Failed to fetch PAT: ${formatError(error)}`)
                return { name: req.name, fallback_env: req.fallback_env, success: false }
              }
            })

            const results = await Promise.all(fetchPromises)

            for (const result of results) {
              if (result.success) {
                console.log(`[${result.name}] Using GitHubApp token`)
                tokensOutput[result.name] = result.token
                core.setOutput(result.name, result.token)
              } else {
                const fallbackValue = process.env[result.fallback_env]
                if (!fallbackValue) {
                  core.setFailed(`Token ${result.name} failed and no fallback (${result.fallback_env}) provided.`)
                  return
                }
                console.log(`[${result.name}] Using fallback token from ${result.fallback_env}`)
                tokensOutput[result.name] = fallbackValue.trim()
                core.setOutput(result.name, fallbackValue.trim())
              }
            }
          } else {
            // Auth failed - use fallbacks for all tokens
            for (const req of tokenRequests) {
              const fallbackValue = process.env[req.fallback_env]
              if (!fallbackValue) {
                core.setFailed(`Auth failed and no fallback (${req.fallback_env}) provided for ${req.name}.`)
                return
              }
              console.log(`[${req.name}] Using fallback token from ${req.fallback_env}`)
              tokensOutput[req.name] = fallbackValue.trim()
              core.setOutput(req.name, fallbackValue.trim())
            }
          }

          core.setOutput('tokens_json', JSON.stringify(tokensOutput))

